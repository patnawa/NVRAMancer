name: hardware-in-loop

on:
  schedule:
    # Scheduled coverage is deliberately read-only.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: Operation policy
        required: true
        default: readonly
        type: choice
        options: [readonly, destructive]
      target:
        description: Bench target (all is read-only only)
        required: true
        default: all
        type: choice
        options: [all, ch341, ch347, ezp, ch347-libusb]
      chip:
        description: Exact sacrificial chip name (required for destructive mode)
        required: false
        type: string
      image_path:
        description: Absolute station-local full-chip .bin path (destructive only)
        required: false
        type: string
      image_sha256:
        description: Exact SHA-256 of the destructive test image
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: hil-${{ github.event_name }}-${{ inputs.target || 'scheduled' }}
  cancel-in-progress: false

jobs:
  windows-readonly:
    if: github.event_name == 'schedule' || inputs.mode == 'readonly'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: ch341
            label: aspx-hil-ch341
          - target: ch347
            label: aspx-hil-ch347
          - target: ezp
            label: aspx-hil-ezp
    runs-on: [self-hosted, Windows, '${{ matrix.label }}']
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Build the tested release candidate once
        if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == matrix.target
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools\build.ps1 -Release

      - name: Run safe live checks
        if: github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == matrix.target
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File tools\hil.ps1 `
            -Mode ReadOnly -Target '${{ matrix.target }}' -ArtifactDir hil-results

      - name: Upload bench evidence
        if: always() && (github.event_name == 'schedule' || inputs.target == 'all' || inputs.target == matrix.target)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hil-${{ matrix.target }}-${{ github.sha }}
          path: hil-results/
          if-no-files-found: warn
          retention-days: 14

  linux-ch347-readonly:
    if: >-
      github.event_name == 'schedule' ||
      (inputs.mode == 'readonly' &&
       (inputs.target == 'all' || inputs.target == 'ch347-libusb'))
    runs-on: [self-hosted, Linux, aspx-hil-ch347-libusb]
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Compile and run read-only CH347 smoke test
        run: ./tools/hil.sh readonly

      - name: Upload bench evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hil-ch347-libusb-${{ github.sha }}
          path: hil-results/
          if-no-files-found: warn
          retention-days: 14

  windows-destructive:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.mode == 'destructive' &&
      inputs.target != 'all' &&
      inputs.target != 'ch347-libusb'
    runs-on: [self-hosted, Windows, 'aspx-hil-${{ inputs.target }}']
    timeout-minutes: 90
    environment: hardware-in-loop-destructive
    permissions:
      contents: read

    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Require complete destructive fixture inputs
        shell: pwsh
        env:
          HIL_CHIP: ${{ inputs.chip }}
          HIL_IMAGE_PATH: ${{ inputs.image_path }}
          HIL_IMAGE_SHA256: ${{ inputs.image_sha256 }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HIL_CHIP)) { throw 'chip is required' }
          if ([string]::IsNullOrWhiteSpace($env:HIL_IMAGE_PATH)) { throw 'image_path is required' }
          if ($env:HIL_IMAGE_SHA256 -notmatch '^[0-9A-Fa-f]{64}$') {
            throw 'image_sha256 must contain exactly 64 hexadecimal digits'
          }

      - name: Build the tested release candidate once
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools\build.ps1 -Release

      - name: Program, verify, and restore sacrificial fixture
        shell: pwsh
        env:
          HIL_TARGET: ${{ inputs.target }}
          HIL_CHIP: ${{ inputs.chip }}
          HIL_IMAGE_PATH: ${{ inputs.image_path }}
          HIL_IMAGE_SHA256: ${{ inputs.image_sha256 }}
        run: |
          powershell -ExecutionPolicy Bypass -File tools\hil.ps1 `
            -Mode Destructive -Target $env:HIL_TARGET `
            -Chip $env:HIL_CHIP -Image $env:HIL_IMAGE_PATH `
            -ExpectedImageSha256 $env:HIL_IMAGE_SHA256 `
            -ArtifactDir hil-results

      # The backup is intentionally retained: if fixture restore fails, it is
      # the exact recovery image. Use synthetic data on sacrificial chips only.
      - name: Upload bench evidence and restore image
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hil-destructive-${{ inputs.target }}-${{ github.sha }}
          path: hil-results/
          if-no-files-found: error
          retention-days: 14
