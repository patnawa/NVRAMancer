name: build

on:
  push:
    branches: [main]
    # A tag like v4.9.0.0 publishes a GitHub release with the zip attached,
    # so the published zip is always the one built and tested from that tag.
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write   # creating the release on tag pushes

    steps:
      - uses: actions/checkout@v4

      # Catch a tag that points at the wrong commit before spending twenty
      # minutes building it. The tag must be exactly v<PROX_VERSION>.
      - name: The tag must match PROX_VERSION
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $src = Get-Content software\appver.pas -Raw
          if ($src -notmatch "PROX_VERSION\s*=\s*'([0-9.]+)'") { throw "no PROX_VERSION in software\appver.pas" }
          $v = $Matches[1]
          $tag = "${{ github.ref_name }}"
          if ($tag -ne "v$v") { throw "tag $tag does not match PROX_VERSION $v; retag the release commit" }

      # The project targets win32, so the 64-bit Lazarus cannot build it
      # without an i386 cross compiler. Install the 32-bit one.
      - name: Cache Lazarus
        id: cache-lazarus
        uses: actions/cache@v4
        with:
          path: C:\lazarus32
          key: lazarus-4.8-fpc-3.2.2-win32

      - name: Install Lazarus 32 bit
        if: steps.cache-lazarus.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $url = "https://downloads.sourceforge.net/project/lazarus/Lazarus%20Windows%2032%20bits/Lazarus%204.8/lazarus-4.8-fpc-3.2.2-win32.exe"
          curl.exe -L --fail --retry 3 -o lazarus.exe $url
          Start-Process -FilePath .\lazarus.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/NOCANCEL","/DIR=C:\lazarus32","/TASKS=" -Wait
          if (-not (Test-Path C:\lazarus32\lazbuild.exe)) { throw "Lazarus did not install" }

      - name: Build and test
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools\build.ps1

      - name: Assemble the release folder
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File tools\build.ps1 -Release

      - uses: actions/upload-artifact@v4
        with:
          name: AsProgrammer-ProX
          path: release/*.zip
          if-no-files-found: error

      # Only a tag publishes. The zip is the same one the tests above just
      # ran against; nothing is rebuilt or repackaged by hand.
      - name: Publish the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          fail_on_unmatched_files: true
          generate_release_notes: true

  # The GUI is Windows only, but nothing that decides whether a chip survives
  # lives in the GUI. The parser, the erase planner, the protection decoder and
  # the protocol layers are all LCL free, so they get a second compiler and a
  # second target here. A pointer bug that i386 tolerates and x86-64 does not
  # is exactly the kind of thing this catches for free.
  linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Free Pascal
        run: sudo apt-get update && sudo apt-get install -y fp-compiler

      - name: Run the hardware-free suites
        run: |
          chmod +x tools/build.sh
          ./tools/build.sh
